schema: spec-driven

context: |
  Спецификации библиотеки `mtdx62` — Python-пакета на PyPI, который описывает регистры
  датчиков присутствия MTD062-MB и MTD262-MB и отдаёт типизированный объект устройства.

  Здесь только требования библиотеки: карта регистров, декодирование значений, планирование
  чтений, семантика ошибок, отсутствие зависимости от Home Assistant. Поведение сущностей
  Home Assistant — в `integrations/mtdx62/openspec/`; сквозные правила — в
  `openspec/specs/conventions/` в корне рабочего пространства.

  Библиотека строится на `modbus-connection` и принимает `ModbusUnit`: соединение ей не
  принадлежит, юнит передаёт вызывающая сторона.

  Факты об устройстве и карта регистров — `docs/DEVICE-FACTS.md` этого репозитория,
  материалы производителя — `docs/sources/`, распознанный текст — `docs/extracted-text/`.
  Стек: Python 3.14, `modbus-connection` с бэкендом `tmodbus`, тесты на mock-бэкенде.

rules:
  proposal:
    - "Указать, как требование проверяется без железа и без Home Assistant: тест на mock-бэкенде."
    - "Назвать версию библиотеки, в которой контракт появляется или меняется."
  specs:
    - "Требование описывает поведение библиотеки: что приходит на вход, что получается на выходе,
      какое исключение поднимается. Никаких сущностей Home Assistant и упоминаний hass."
    - "Адрес регистра, разрешение и единица измерения — часть контракта библиотеки, указывать явно."
    - "Изменение контракта, ломающее интеграцию, помечается как BREAKING и требует мажорной версии."
  design:
    - "Описать разложение на компоненты (измерения, параметры) и почему чтение укладывается в
      минимальное число запросов."
  tasks:
    - "Тесты идут в группе той реализации, которую проверяют."
    - "Задачи интеграции здесь не ставятся."

operations:
  apply:
    guidance:
      - "Любое новое поле модели сначала описывается спецификацией, потом кодом."
