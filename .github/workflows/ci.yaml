name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, typing, tests (modbus-connection ${{ matrix.modbus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modbus: ["floor", "newest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Pin the dependency floor
        if: matrix.modbus == 'floor'
        run: pip install "modbus-connection==4.12.3"
      - name: Show the dependency under test
        run: python -c "import importlib.metadata as m; print('modbus-connection', m.version('modbus-connection'))"
      - name: README links are absolute
        run: python scripts/check_readme_links.py
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff check
        run: ruff check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest --cov=mtdx62_modbus_library --cov-report=term-missing --cov-fail-under=95
